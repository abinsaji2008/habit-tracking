<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#171a21;font-family:system-ui,Arial}.app{max-width:1200px;margin:auto;padding:16px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 330px;gap:16px}.card{background:#fff;border:1px solid #e4e7ed;border-radius:16px;padding:16px;margin-bottom:16px}h1,h2{margin:0 0 12px}h1{font-size:21px}h2{font-size:16px}.muted{color:#747b88;font-size:12px}.logo{width:42px;height:42px;border-radius:13px;background:#5b5bd6;color:#fff;display:grid;place-items:center;font-weight:800}.brand{display:flex;align-items:center;gap:10px}.user{display:flex;align-items:center;gap:8px}.avatar{width:32px;height:32px;border-radius:50%}.status{font-size:11px;padding:7px 10px;border-radius:20px;border:1px solid #ddd}.ok{color:#16803a;background:#effdf3}.err{color:#b91c1c;background:#fff1f2}.progress{height:10px;background:#eceef3;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#5b5bd6;transition:.25s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid #e4e7ed;border-radius:11px;padding:10px}.stat span{font-size:11px;color:#747b88}.stat b{display:block;font-size:20px}input,textarea,button{font:inherit}input,textarea{border:1px solid #dfe2e8;border-radius:9px;padding:10px;width:100%}.inputs{display:flex;gap:7px}.primary,.secondary,.danger,.check{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#5b5bd6;color:#fff}.secondary{background:#eef0f4}.danger{background:#fff0f0;color:#c22}.task,.habit{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #eee}.task:last-child,.habit:last-child{border:0}.grow{flex:1}.done{text-decoration:line-through;color:#999}.check{background:#eef0f4}.check.done{background:#dcfce7;color:#166534}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calhead{text-align:center;color:#888;font-size:10px}.day{min-height:44px;border:0;border-radius:8px;background:#f3f4f6;cursor:pointer;font-size:10px}.day.today{outline:2px solid #5b5bd6}.day.selected{background:#eeeeff}.day.good{background:#dcfce7}.day b{display:block;padding-top:5px}.day small{color:#777}.login{position:fixed;inset:0;background:#f5f7fb;display:grid;place-items:center;padding:20px;z-index:5}.loginbox{background:#fff;padding:30px;border-radius:20px;width:min(400px,100%);text-align:center;border:1px solid #ddd}.loginbox .logo{margin:auto}.loginbox p{color:#747b88;font-size:13px}.google{width:100%;padding:12px;background:#fff;border:1px solid #d8dce4;border-radius:9px;font-weight:650;cursor:pointer}.error{display:none;margin-top:10px;padding:9px;background:#fff1f2;color:#b91c1c;border-radius:9px;font-size:11px}@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:10px}.status{display:none}.card{padding:13px}.inputs{flex-wrap:wrap}.inputs>*{min-width:100%}.stats{gap:5px}.day{min-height:39px}}
</style></head><body>
  <button href="/study-planner.html">Here</button>
<div id="login" class="login"><div class="loginbox"><div class="logo">✓</div><h1>Daily Tracker</h1><p>Sign in to sync your private tracker with Firebase.</p><button id="loginBtn" class="google">Continue with Google</button><div id="loginError" class="error"></div></div></div>
<div id="app" class="app" style="display:none">
<header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Daily Tracker</h1><div id="userName" class="muted"></div></div></div><div class="user"><span id="status" class="status">Connecting…</span><img id="avatar" class="avatar" style="display:none"><button id="logout" class="secondary">Sign out</button></div></header>
<div class="grid"><main>
<section class="card"><div class="row"><div><h1 id="dateTitle"></h1><div id="dateKey" class="muted"></div></div><button id="today" class="secondary">Today</button></div><div class="progress"><div id="fill" class="fill"></div></div><div class="stats"><div class="stat"><span>Total items</span><b id="total">0</b></div><div class="stat"><span>Completed</span><b id="completed">0</b></div><div class="stat"><span>Progress</span><b id="pct">0%</b></div></div></section>
<section class="card"><h2>To-Do</h2><div class="inputs"><input id="taskInput" placeholder="What needs to be done?"><input id="priority" placeholder="Priority" value="Normal"><button id="addTask" class="primary">Add task</button></div><div id="tasks"></div></section>
<section class="card"><h2>Habit Tracker</h2><div class="inputs"><input id="habitInput" placeholder="Add a habit"><input id="goalInput" placeholder="Goal (optional)"><button id="addHabit" class="primary">Add habit</button></div><div id="habits"></div></section>
<section class="card"><h2>Daily Notes</h2><textarea id="notes" rows="4" placeholder="Notes for this day"></textarea><button id="saveNotes" class="primary" style="width:100%;margin-top:8px">Save notes</button></section>
</main>
<aside><section class="card"><div class="row"><h2 id="monthName"></h2><div><button id="prev" class="secondary">←</button><button id="next" class="secondary">→</button></div></div><div id="calendar" class="calendar"></div><button id="report" class="secondary" style="width:100%;margin-top:10px">Open Monthly Report</button></section></aside></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,get,set,remove}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const cfg={apiKey:"AIzaSyAipiHiXzu4mSvK6BbNjImOHYdkqxKSt3c",authDomain:"tracking-98a71.firebaseapp.com",databaseURL:"https://tracking-98a71-default-rtdb.firebaseio.com/",projectId:"tracking-98a71",storageBucket:"tracking-98a71.firebasestorage.app",messagingSenderId:"841004547092",appId:"1:841004547092:web:129ea46b2297ce01c0fb01",measurementId:"G-XQFRPXB3J9"};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();const $=x=>document.getElementById(x);
let user,data={tasks:{},habits:{},dailyRecords:{}},selected=key(new Date()),month=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function key(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function root(p=""){return ref(db,`users/${user.uid}${p?"/"+p:""}`)}function hdone(id,d){return!!data.dailyRecords?.[d]?.habitChecks?.[id]}
async function load(){try{$("status").textContent="Syncing…";const s=await get(root());data=s.exists()?s.val():data;data.tasks=data.tasks||{};data.habits=data.habits||{};data.dailyRecords=data.dailyRecords||{};render();$("status").textContent="● Firebase connected";$("status").className="status ok"}catch(e){console.error(e);$("status").textContent="● Firebase error";$("status").className="status err";alert(e.message)}}
function tasks(d=selected){return Object.entries(data.tasks).filter(([id,t])=>t.date===d)}function habits(){return Object.entries(data.habits).filter(([id,h])=>h.active!==false)}
function renderTasks(){const a=tasks();$("tasks").innerHTML=a.length?a.map(([id,t])=>`<div class="task ${t.completed?"done":""}"><input type="checkbox" ${t.completed?"checked":""} data-t="${id}"><div class="grow">${esc(t.title)}</div><small>${esc(t.priority||"Normal")}</small><button class="danger" data-d="${id}">×</button></div>`).join(""):`<div class="muted" style="padding:15px;text-align:center">No tasks for this day.</div>`;document.querySelectorAll("[data-t]").forEach(x=>x.onchange=()=>toggleTask(x.dataset.t));document.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>delTask(x.dataset.d))}
function renderHabits(){const a=habits();$("habits").innerHTML=a.length?a.map(([id,h])=>`<div class="habit"><div class="grow"><b>${esc(h.name)}</b><div class="muted">${esc(h.goal||"Daily")}</div></div><button class="check ${hdone(id,selected)?"done":""}" data-h="${id}">${hdone(id,selected)?"✓ Done":"Mark done"}</button><button class="danger" data-hd="${id}">×</button></div>`).join(""):`<div class="muted" style="padding:15px;text-align:center">No habits yet.</div>`;document.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>toggleHabit(x.dataset.h,selected));document.querySelectorAll("[data-hd]").forEach(x=>x.onclick=()=>delHabit(x.dataset.hd))}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();$("monthName").textContent=month.toLocaleString(undefined,{month:"long",year:"numeric"});let s=["S","M","T","W","T","F","S"].map(x=>`<div class="calhead">${x}</div>`).join("");for(let i=0;i<first;i++)s+="<div></div>";for(let d=1;d<=n;d++){const k=key(new Date(y,m,d)),ts=tasks(k),hs=habits(),tot=ts.length+hs.length,done=ts.filter(x=>x[1].completed).length+hs.filter(x=>hdone(x[0],k)).length,p=tot?Math.round(done/tot*100):0;s+=`<button class="day ${k===key(new Date())?"today":""} ${k===selected?"selected":""} ${p===100&&tot?"good":""}" data-day="${k}"><b>${d}</b><small>${tot?p+"%":"—"}</small></button>`}$("calendar").innerHTML=s;document.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{selected=x.dataset.day;render()})}
function renderProgress(){const ts=tasks(),hs=habits(),tot=ts.length+hs.length,done=ts.filter(x=>x[1].completed).length+hs.filter(x=>hdone(x[0],selected)).length,p=tot?Math.round(done/tot*100):0;$("total").textContent=tot;$("completed").textContent=done;$("pct").textContent=p+"%";$("fill").style.width=p+"%";const d=new Date(selected+"T00:00:00");$("dateTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});$("dateKey").textContent=selected;$("notes").value=data.dailyRecords?.[selected]?.notes||""}
function render(){renderTasks();renderHabits();renderProgress();renderCalendar()}
async function addTask(){const v=$("taskInput").value.trim();if(!v)return;await set(root("tasks/t_"+Date.now()),{title:v,date:selected,priority:$("priority").value.trim()||"Normal",completed:false,createdAt:Date.now()});$("taskInput").value="";await load()}
async function toggleTask(id){await set(root("tasks/"+id),{...data.tasks[id],completed:!data.tasks[id].completed});await load()}async function delTask(id){if(confirm("Delete task?")){await remove(root("tasks/"+id));await load()}}
async function addHabit(){const v=$("habitInput").value.trim();if(!v)return;await set(root("habits/h_"+Date.now()),{name:v,goal:$("goalInput").value.trim(),active:true,createdAt:Date.now()});$("habitInput").value="";$("goalInput").value="";await load()}
async function toggleHabit(id,d){const r=root(`dailyRecords/${d}/habitChecks/${id}`);if(hdone(id,d))await remove(r);else await set(r,true);await load()}async function delHabit(id){if(confirm("Delete habit?")){await remove(root("habits/"+id));await load()}}
$("addTask").onclick=addTask;$("addHabit").onclick=addHabit;$("saveNotes").onclick=async()=>{await set(root(`dailyRecords/${selected}/notes`),$("notes").value);await load()};$("prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$("next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};$("today").onclick=()=>{selected=key(new Date());month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};$("report").onclick=()=>location.href="report.html";$("logout").onclick=()=>signOut(auth);$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){$("loginError").textContent=e.code+": "+e.message;$("loginError").style.display="block"}};
onAuthStateChanged(auth,async u=>{user=u;if(u){$("login").style.display="none";$("app").style.display="block";$("userName").textContent=u.displayName||u.email||"";if(u.photoURL){$("avatar").src=u.photoURL;$("avatar").style.display="block"}await load()}else{$("login").style.display="grid";$("app").style.display="none"}});
</script></body></html>
