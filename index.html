<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#171a21;
  --muted:#737b88;
  --line:#e6e9ef;
  --primary:#5b5bd6;
  --primary-soft:#eeeeff;
  --green:#16a34a;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  max-width:1250px;
  margin:auto;
  padding:18px;
}

/* HEADER */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:800;
}

.brand h1{
  margin:0;
  font-size:21px;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
}

.status{
  padding:8px 12px;
  border-radius:50px;
  border:1px solid var(--line);
  background:white;
  font-size:12px;
}

.status.ok{
  color:var(--green);
  background:#effdf3;
}

.status.error{
  color:#b91c1c;
  background:#fff1f2;
}

/* LAYOUT */

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.03);
}

.section{
  margin-top:16px;
}

/* HERO */

.hero{
  padding:22px;
}

.heroRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.dateTitle{
  font-size:25px;
  font-weight:750;
}

.progress{
  height:9px;
  background:#eceef3;
  border-radius:99px;
  overflow:hidden;
  margin-top:14px;
}

.progressBar{
  height:100%;
  width:0;
  background:var(--primary);
  transition:.25s;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#fafaff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
}

.stat span{
  color:var(--muted);
}

.stat b{
  display:block;
  font-size:22px;
  margin-top:4px;
}

/* FORM */

h2{
  font-size:16px;
  margin:0 0 13px;
}

.inputRow{
  display:flex;
  gap:8px;
}

input,
select,
textarea{
  border:1px solid #dfe2e8;
  background:white;
  border-radius:10px;
  padding:10px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
}

.inputRow input:first-child{
  flex:1;
}

.primary{
  background:var(--primary);
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

.secondary{
  background:#f0f1f5;
  color:var(--text);
  padding:9px 12px;
  border-radius:10px;
}

.danger{
  background:#fff0f0;
  color:var(--red);
  padding:7px 10px;
  border-radius:8px;
}

/* TASKS */

.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.task:last-child{
  border-bottom:0;
}

.task input{
  width:18px;
  height:18px;
}

.taskTitle{
  flex:1;
}

.task.done .taskTitle{
  text-decoration:line-through;
  color:#9aa1ad;
}

.tag{
  font-size:11px;
  padding:4px 7px;
  border-radius:99px;
  background:#f1f2f6;
  color:#606775;
}

/* HABITS */

.habit{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.habit:last-child{
  border-bottom:0;
}

.habitGoal{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.check{
  background:#f0f2f6;
  padding:8px 11px;
  border-radius:9px;
}

.check.done{
  background:#dcfce7;
  color:#166534;
}

/* CALENDAR */

.sideSticky{
  position:sticky;
  top:15px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.calendarHeader{
  color:var(--muted);
  font-size:10px;
  text-align:center;
}

.day{
  min-height:38px;
  border-radius:9px;
  background:#f5f6f8;
  padding:6px;
  text-align:center;
  font-size:11px;
}

.day.today{
  outline:2px solid var(--primary);
}

.day.has{
  background:var(--primary-soft);
}

.dayNum{
  font-weight:700;
}

.dayCount{
  font-size:9px;
  color:var(--muted);
}

/* MONTH */

.monthHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.monthTable{
  overflow:auto;
}

table{
  border-collapse:collapse;
  min-width:760px;
  width:100%;
}

th,
td{
  border:1px solid var(--line);
  padding:7px;
  text-align:center;
  font-size:11px;
}

th:first-child,
td:first-child{
  position:sticky;
  left:0;
  background:white;
  text-align:left;
  z-index:1;
}

.dayCell{
  width:27px;
  height:27px;
  border-radius:6px;
  background:#f1f2f5;
  color:#333;
}

.dayCell.done{
  background:var(--green);
  color:white;
}

/* LOGIN */

.login{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:100;
}

.login.hidden{
  display:none;
}

.loginCard{
  width:min(420px,100%);
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.loginCard .logo{
  margin:auto;
  margin-bottom:15px;
}

.loginCard h2{
  font-size:24px;
}

.loginCard p{
  color:var(--muted);
  line-height:1.5;
}

.googleButton{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:white;
  border:1px solid #d7dbe3;
  font-weight:600;
}

.loginError{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#fff1f2;
  color:#b91c1c;
  font-size:12px;
}

/* MOBILE */

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .sideSticky{
    position:static;
  }

}

@media(max-width:560px){

  .app{
    padding:12px;
  }

  .top{
    align-items:flex-start;
  }

  .brand h1{
    font-size:19px;
  }

  .status{
    font-size:10px;
    padding:7px 9px;
  }

  .hero{
    padding:15px;
  }

  .dateTitle{
    font-size:21px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:9px;
  }

  .stat b{
    font-size:19px;
  }

  .card{
    padding:14px;
    border-radius:15px;
  }

  .inputRow{
    flex-wrap:wrap;
  }

  .inputRow input,
  .inputRow select{
    min-width:100%;
  }

  .inputRow button{
    flex:1;
  }

  .habit{
    grid-template-columns:1fr auto;
  }

  .habit .danger{
    grid-column:2;
  }

  .calendar{
    gap:3px;
  }

  .day{
    min-height:35px;
    padding:4px 2px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login">

  <div class="loginCard">

    <div class="logo">✓</div>

    <h2>Daily Tracker</h2>

    <p>
      Sign in to keep your personal tracker
      private and synchronized across devices.
    </p>

    <button id="googleLogin" class="googleButton">
      Continue with Google
    </button>

    <div id="loginError" class="loginError"></div>

  </div>

</div>


<!-- APP -->

<div id="app" class="app" style="display:none">

<header class="top">

  <div class="brand">

    <div class="logo">✓</div>

    <div>
      <h1>Daily Tracker</h1>
      <p id="userName">
        Personal productivity dashboard
      </p>
    </div>

  </div>

  <div class="user">

    <span id="firebaseStatus" class="status">
      Connecting…
    </span>

    <img
      id="userAvatar"
      class="avatar"
      style="display:none"
    >

    <button
      id="logoutButton"
      class="secondary"
    >
      Sign out
    </button>

  </div>

</header>


<div class="layout">

<main>

<!-- TODAY -->

<section class="card hero">

  <div class="heroRow">

    <div>

      <div
        id="todayTitle"
        class="dateTitle"
      ></div>

      <div
        id="todayDate"
        class="muted"
      ></div>

    </div>

    <button
      id="refreshButton"
      class="secondary"
    >
      ↻ Refresh
    </button>

  </div>


  <div class="progress">

    <div
      id="progressBar"
      class="progressBar"
    ></div>

  </div>


  <div class="stats">

    <div class="stat">

      <span>Tasks</span>

      <b id="taskCount">
        0
      </b>

    </div>

    <div class="stat">

      <span>Completed</span>

      <b id="completedCount">
        0
      </b>

    </div>

    <div class="stat">

      <span>Progress</span>

      <b id="percentage">
        0%
      </b>

    </div>

  </div>

</section>


<!-- TODO -->

<section class="card section">

<h2>Today's To-Do</h2>

<div class="inputRow">

<input
  id="taskInput"
  type="text"
  placeholder="What needs to be done?"
>

<select id="priority">

<option>Normal</option>
<option>High</option>
<option>Low</option>

</select>

<button
  id="addTaskButton"
  class="primary"
>
Add task
</button>

</div>

<div id="taskList"></div>

</section>


<!-- HABITS -->

<section class="card section">

<h2>Habits</h2>

<div class="inputRow">

<input
  id="habitInput"
  type="text"
  placeholder="Add a habit..."
>

<input
  id="goalInput"
  type="text"
  placeholder="Goal (optional)"
>

<button
  id="addHabitButton"
  class="primary"
>
Add
</button>

</div>

<div id="habitList"></div>

</section>


<!-- MONTH -->

<section class="card section">

<div class="monthHeader">

<h2 id="monthName"></h2>

<div>

<button
  id="previousMonth"
  class="secondary"
>
←
</button>

<button
  id="nextMonth"
  class="secondary"
>
→
</button>

</div>

</div>

<div class="monthTable">

<table>

<thead id="monthHead"></thead>

<tbody id="monthBody"></tbody>

</table>

</div>

</section>

</main>


<!-- SIDEBAR -->

<aside>

<div class="card sideSticky">

<h2>This Month</h2>

<div
  id="calendar"
  class="calendar"
></div>


<div class="section">

<h2>Daily Notes</h2>

<textarea
  id="notes"
  style="width:100%"
  placeholder="Write something about today..."
></textarea>

<button
  id="saveNotesButton"
  class="primary"
  style="margin-top:8px;width:100%"
>
Save notes
</button>

</div>


<div class="section">

<h2>Monthly Report</h2>

<button
  id="pdfButton"
  class="secondary"
  style="width:100%"
>
Print / Save PDF
</button>

</div>

</div>

</aside>

</div>

</div>


<script type="module">

/* ============================================
   FIREBASE
============================================ */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAipiHiXzu4mSvK6BbNjImOHYdkqxKSt3c",

  authDomain:
    "tracking-98a71.firebaseapp.com",

  databaseURL:
    "https://tracking-98a71-default-rtdb.firebaseio.com/",

  projectId:
    "tracking-98a71",

  storageBucket:
    "tracking-98a71.firebasestorage.app",

  messagingSenderId:
    "841004547092",

  appId:
    "1:841004547092:web:129ea46b2297ce01c0fb01",

  measurementId:
    "G-XQFRPXB3J9"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const database =
  getDatabase(firebaseApp);

const provider =
  new GoogleAuthProvider();


/* ============================================
   STATE
============================================ */

let currentUser = null;

let data = {

  tasks:{},

  habits:{},

  dailyRecords:{}

};

let currentMonth =
  new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
  );


/* ============================================
   HELPERS
============================================ */

const $ = id =>
  document.getElementById(id);


function dateKey(date){

  return date.getFullYear()
    + "-"
    + String(date.getMonth()+1).padStart(2,"0")
    + "-"
    + String(date.getDate()).padStart(2,"0");

}


const today =
  dateKey(new Date());


function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char]));

}


function userRoot(){

  return ref(
    database,
    "users/" + currentUser.uid
  );

}


function setStatus(text,success=true){

  $("firebaseStatus").textContent =
    text;

  $("firebaseStatus").className =
    success
      ? "status ok"
      : "status error";

}


/* ============================================
   FIREBASE LOAD
============================================ */

async function loadData(){

  if(!currentUser)
    return;

  try{

    setStatus(
      "Connecting to Firebase…"
    );

    const snapshot =
      await get(userRoot());

    if(snapshot.exists()){

      const value =
        snapshot.val();

      data.tasks =
        value.tasks || {};

      data.habits =
        value.habits || {};

      data.dailyRecords =
        value.dailyRecords || {};

    }else{

      data = {

        tasks:{},
        habits:{},
        dailyRecords:{}

      };

    }

    $("notes").value =
      data.dailyRecords[today]?.notes || "";

    renderAll();

    setStatus(
      "● Firebase connected",
      true
    );

  }catch(error){

    console.error(error);

    setStatus(
      "● Firebase error",
      false
    );

    alert(
      "Firebase error:\n\n"
      + error.message
    );

  }

}


/* ============================================
   TASKS
============================================ */

async function addTask(){

  const title =
    $("taskInput").value.trim();

  if(!title)
    return;

  const id =
    "t_" +
    Date.now();

  const task = {

    title:title,

    date:today,

    priority:
      $("priority").value,

    completed:false,

    createdAt:
      Date.now()

  };

  try{

    await set(
      ref(
        database,
        "users/"
        + currentUser.uid
        + "/tasks/"
        + id
      ),
      task
    );

    $("taskInput").value="";

    await loadData();

  }catch(error){

    alert(
      "Task could not be saved:\n\n"
      + error.message
    );

  }

}


async function toggleTask(id){

  const task =
    data.tasks[id];

  if(!task)
    return;

  try{

    await set(

      ref(
        database,
        "users/"
        + currentUser.uid
        + "/tasks/"
        + id
      ),

      {
        ...task,
        completed:
          !task.completed
      }

    );

    await loadData();

  }catch(error){

    alert(error.message);

  }

}


async function deleteTask(id){

  if(
    !confirm(
      "Delete this task?"
    )
  )
    return;

  try{

    await remove(

      ref(
        database,
        "users/"
        + currentUser.uid
        + "/tasks/"
        + id
      )

    );

    await loadData();

  }catch(error){

    alert(error.message);

  }

}


function renderTasks(){

  const tasks =
    Object.entries(data.tasks)

      .filter(
        ([id,task]) =>
          task.date === today
      )

      .sort(
        (a,b) =>
          (a[1].createdAt || 0)
          -
          (b[1].createdAt || 0)
      );


  if(!tasks.length){

    $("taskList").innerHTML =

      `<div
        class="muted"
        style="padding:18px 0;text-align:center"
      >
        Nothing planned yet.
      </div>`;

    return;

  }


  $("taskList").innerHTML =

    tasks.map(
      ([id,task]) => `

      <div
        class="task ${task.completed ? "done":""}"
      >

        <input
          type="checkbox"
          ${task.completed ? "checked":""}
          data-task-toggle="${id}"
        >

        <div class="taskTitle">
          ${escapeHTML(task.title)}
        </div>

        <span class="tag">
          ${escapeHTML(task.priority)}
        </span>

        <button
          class="danger"
          data-task-delete="${id}"
        >
          ×
        </button>

      </div>

      `
    ).join("");


  document
    .querySelectorAll("[data-task-toggle]")
    .forEach(button => {

      button.addEventListener(
        "change",
        () =>
          toggleTask(
            button.dataset.taskToggle
          )
      );

    });


  document
    .querySelectorAll("[data-task-delete]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deleteTask(
            button.dataset.taskDelete
          )
      );

    });

}


/* ============================================
   HABITS
============================================ */

async function addHabit(){

  const name =
    $("habitInput").value.trim();

  if(!name)
    return;

  const id =
    "h_" +
    Date.now();

  const habit = {

    name:name,

    goal:
      $("goalInput").value.trim(),

    active:true,

    createdAt:
      Date.now()

  };


  try{

    await set(

      ref(
        database,
        "users/"
        + currentUser.uid
        + "/habits/"
        + id
      ),

      habit

    );

    $("habitInput").value="";
    $("goalInput").value="";

    await loadData();

  }catch(error){

    alert(
      "Habit could not be saved:\n\n"
      + error.message
    );

  }

}


async function toggleHabit(
  id,
  date
){

  const path =
    "users/"
    + currentUser.uid
    + "/dailyRecords/"
    + date
    + "/habitChecks/"
    + id;

  const checked =
    !!data.dailyRecords
      [date]
      ?.habitChecks
      ?. [id];


  try{

    if(checked){

      await remove(
        ref(database,path)
      );

    }else{

      await set(
        ref(database,path),
        true
      );

    }

    await loadData();

  }catch(error){

    alert(
      "Habit could not be saved:\n\n"
      + error.message
    );

  }

}


async function deleteHabit(id){

  if(
    !confirm(
      "Delete this habit?"
    )
  )
    return;

  try{

    await remove(

      ref(
        database,
        "users/"
        + currentUser.uid
        + "/habits/"
        + id
      )

    );

    await loadData();

  }catch(error){

    alert(error.message);

  }

}


function renderHabits(){

  const habits =
    Object.entries(data.habits)
      .filter(
        ([id,habit]) =>
          habit.active !== false
      );


  if(!habits.length){

    $("habitList").innerHTML =

      `<div
        class="muted"
        style="padding:18px 0;text-align:center"
      >
        Add habits to start tracking.
      </div>`;

    return;

  }


  $("habitList").innerHTML =

    habits.map(
      ([id,habit]) => {

        const checked =
          !!data
            .dailyRecords
            [today]
            ?.habitChecks
            ?. [id];


        return `

        <div class="habit">

          <div>

            <b>
              ${escapeHTML(habit.name)}
            </b>

            <div class="habitGoal">
              ${escapeHTML(
                habit.goal || "Daily"
              )}
            </div>

          </div>

          <button
            class="check ${checked?"done":""}"
            data-habit="${id}"
          >
            ${checked
              ? "✓ Done"
              : "Mark done"}
          </button>

          <button
            class="danger"
            data-habit-delete="${id}"
          >
            ×
          </button>

        </div>

        `;

      }
    ).join("");


  document
    .querySelectorAll("[data-habit]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          toggleHabit(
            button.dataset.habit,
            today
          )
      );

    });


  document
    .querySelectorAll("[data-habit-delete]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deleteHabit(
            button.dataset.habitDelete
          )
      );

    });

}


/* ============================================
   MONTHLY TRACKER
============================================ */

function daysInMonth(
  year,
  month
){

  return new Date(
    year,
    month + 1,
    0
  ).getDate();

}


function renderMonth(){

  const year =
    currentMonth.getFullYear();

  const month =
    currentMonth.getMonth();

  const days =
    daysInMonth(
      year,
      month
    );


  $("monthName").textContent =
    currentMonth.toLocaleString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );


  let header =
    "<tr><th>Habit</th>";


  for(
    let day=1;
    day<=days;
    day++
  ){

    header +=
      `<th>${day}</th>`;

  }


  header += "</tr>";

  $("monthHead").innerHTML =
    header;


  const habits =
    Object.entries(data.habits)
      .filter(
        ([id,habit]) =>
          habit.active !== false
      );


  if(!habits.length){

    $("monthBody").innerHTML =

      `<tr>
        <td
          colspan="${days+1}"
          class="muted"
        >
          No habits yet.
        </td>
      </tr>`;

    return;

  }


  $("monthBody").innerHTML =

    habits.map(
      ([id,habit]) => {

        let row =
          `<tr>
             <td>
               <b>
                 ${escapeHTML(habit.name)}
               </b>
             </td>`;


        for(
          let day=1;
          day<=days;
          day++
        ){

          const date =
            dateKey(
              new Date(
                year,
                month,
                day
              )
            );


          const checked =
            !!data
              .dailyRecords
              [date]
              ?.habitChecks
              ?. [id];


          row += `

            <td>

              <button
                class="dayCell ${checked?"done":""}"
                data-month-habit="${id}"
                data-month-date="${date}"
              >
                ${checked?"✓":""}
              </button>

            </td>

          `;

        }


        row += "</tr>";

        return row;

      }
    ).join("");


  document
    .querySelectorAll(
      "[data-month-habit]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          toggleHabit(
            button.dataset.monthHabit,
            button.dataset.monthDate
          )
      );

    });

}


/* ============================================
   CALENDAR
============================================ */

function renderCalendar(){

  const year =
    currentMonth.getFullYear();

  const month =
    currentMonth.getMonth();

  const days =
    daysInMonth(
      year,
      month
    );

  const first =
    new Date(
      year,
      month,
      1
    ).getDay();


  let html="";


  [
    "S",
    "M",
    "T",
    "W",
    "T",
    "F",
    "S"
  ].forEach(day => {

    html +=
      `<div class="calendarHeader">
        ${day}
      </div>`;

  });


  for(
    let i=0;
    i<first;
    i++
  ){

    html += "<div></div>";

  }


  for(
    let day=1;
    day<=days;
    day++
  ){

    const date =
      dateKey(
        new Date(
          year,
          month,
          day
        )
      );


    const count =
      Object.keys(
        data
          .dailyRecords
          [date]
          ?.habitChecks || {}
      ).length;


    html += `

      <div
        class="day
        ${date===today?"today":""}
        ${count?"has":""}"
      >

        <div class="dayNum">
          ${day}
        </div>

        <div class="dayCount">
          ${count ? count+" ✓":""}
        </div>

      </div>

    `;

  }


  $("calendar").innerHTML =
    html;

}


/* ============================================
   PROGRESS
============================================ */

function renderProgress(){

  const tasks =
    Object.values(data.tasks)
      .filter(
        task =>
          task.date === today
      );


  const completed =
    tasks.filter(
      task =>
        task.completed
    ).length;


  const percentage =
    tasks.length
      ? Math.round(
          completed /
          tasks.length *
          100
        )
      : 0;


  $("taskCount").textContent =
    tasks.length;

  $("completedCount").textContent =
    completed;

  $("percentage").textContent =
    percentage + "%";

  $("progressBar").style.width =
    percentage + "%";

}


/* ============================================
   NOTES
============================================ */

async function saveNotes(){

  try{

    await set(

      ref(
        database,
        "users/"
        + currentUser.uid
        + "/dailyRecords/"
        + today
        + "/notes"
      ),

      $("notes").value

    );


    setStatus(
      "● Notes saved",
      true
    );


    setTimeout(
      () =>
        setStatus(
          "● Firebase connected",
          true
        ),
      1200
    );

  }catch(error){

    alert(
      "Notes could not be saved:\n\n"
      + error.message
    );

  }

}


/* ============================================
   PDF
============================================ */

function printReport(){

  const year =
    currentMonth.getFullYear();

  const month =
    currentMonth.getMonth();

  const days =
    daysInMonth(
      year,
      month
    );


  let rows="";


  Object.entries(data.habits)
    .filter(
      ([id,habit]) =>
        habit.active !== false
    )
    .forEach(
      ([id,habit]) => {

        let completed=0;


        for(
          let day=1;
          day<=days;
          day++
        ){

          const date =
            dateKey(
              new Date(
                year,
                month,
                day
              )
            );


          if(
            data
              .dailyRecords
              [date]
              ?.habitChecks
              ?. [id]
          ){

            completed++;

          }

        }


        const rate =
          Math.round(
            completed /
            days *
            100
          );


        rows += `

          <tr>

            <td>
              ${escapeHTML(habit.name)}
            </td>

            <td>
              ${completed}/${days}
            </td>

            <td>
              ${rate}%
            </td>

          </tr>

        `;

      }
    );


  const monthName =
    currentMonth.toLocaleString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );


  const report =
    window.open(
      "",
      "_blank"
    );


  report.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>
Daily Tracker Report
</title>

<style>

body{
  font-family:Arial;
  padding:30px;
}

table{
  border-collapse:collapse;
  width:100%;
}

th,
td{
  border:1px solid #ddd;
  padding:10px;
}

</style>

</head>

<body>

<h1>
Daily Tracker — ${monthName}
</h1>

<table>

<tr>
<th>Habit</th>
<th>Completed</th>
<th>Rate</th>
</tr>

${rows}

</table>

<p>
Use Print → Save as PDF.
</p>

</body>

</html>

  `);


  report.document.close();

  report.print();

}


/* ============================================
   MONTH NAVIGATION
============================================ */

function previousMonth(){

  currentMonth =
    new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()-1,
      1
    );

  renderMonth();
  renderCalendar();

}


function nextMonth(){

  currentMonth =
    new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()+1,
      1
    );

  renderMonth();
  renderCalendar();

}


/* ============================================
   RENDER EVERYTHING
============================================ */

function renderAll(){

  renderTasks();

  renderHabits();

  renderMonth();

  renderCalendar();

  renderProgress();

}
