<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#171a21;--muted:#707784;--line:#e8eaf0;--accent:#5b5bd6;--green:#16a34a;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1250px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px}.status.ok{color:var(--green);background:#effdf3}.status.bad{color:#b91c1c;background:#fff1f2}
.user{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover}.signin{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 15px #1d243308}.hero{padding:22px}.heroRow{display:flex;justify-content:space-between;align-items:center;gap:15px}.dateTitle{font-size:25px;font-weight:750;margin:0}.muted{color:var(--muted)}.progress{height:9px;background:#eceef3;border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:#fafaff;border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{display:block;font-size:22px;margin-top:3px}
h2{font-size:16px;margin:0 0 13px}.section{margin-top:16px}.inputrow{display:flex;gap:8px}.inputrow input{flex:1}input,textarea,select{border:1px solid #dfe2e8;background:#fff;border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:100px;resize:vertical}.primary{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px}.ghost{background:#f1f2f6;color:var(--text);padding:9px 12px;border-radius:10px}.danger{background:#fff0f0;color:#c62828;padding:7px 9px;border-radius:8px}
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:18px;height:18px}.taskTitle{flex:1}.done .taskTitle{text-decoration:line-through;color:#9aa1ad}.tag{font-size:11px;padding:4px 7px;border-radius:99px;background:#f1f2f6;color:#606775}
.habitRow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.habitRow:last-child{border:0}.check{background:#f0f2f6;color:#333;padding:8px 11px;border-radius:9px}.check.on{background:#dcfce7;color:#166534}
.sideSticky{position:sticky;top:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:38px;border-radius:9px;background:#f5f6f8;padding:6px;text-align:center;font-size:11px}.day.today{outline:2px solid var(--accent)}.day.has{background:#e8e8ff}.dayNum{font-weight:700}.dayCount{font-size:9px;color:var(--muted)}
.monthHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthGrid{overflow:auto}.table{border-collapse:collapse;min-width:760px;width:100%}.table th,.table td{border:1px solid var(--line);padding:7px;text-align:center;font-size:11px}.table th:first-child,.table td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1}.cell{width:26px;height:26px;border-radius:6px;background:#f2f3f6}.cell.on{background:#16a34a;color:#fff}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:30}.login.hidden{display:none}.loginCard{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 10px 35px #0001;text-align:center}.loginCard .logo{margin:0 auto 14px}.loginCard h2{font-size:24px;margin-bottom:7px}.loginCard p{color:var(--muted);line-height:1.5}.google{width:100%;background:#fff;border:1px solid #d9dce3;color:#202124;padding:12px;border-radius:10px;font-weight:600}.error{color:#b91c1c;background:#fff1f2;padding:10px;border-radius:10px;margin-top:12px;display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sideSticky{position:static}.app{padding:12px}}
@media(max-width:560px){.top{align-items:flex-start}.brand h1{font-size:19px}.status{font-size:10px;padding:7px 9px}.hero{padding:15px}.dateTitle{font-size:21px}.heroRow{align-items:flex-start}.stats{gap:7px}.stat{padding:9px}.stat b{font-size:19px}.card{border-radius:15px;padding:14px}.inputrow{flex-wrap:wrap}.inputrow input,.inputrow select{min-width:100%}.inputrow button{flex:1}.habitRow{grid-template-columns:1fr auto}.habitRow .danger{grid-column:2}.calendar{gap:3px}.day{min-height:35px;padding:4px 2px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginCard">
    <div class="logo">✓</div>
    <h2>Daily Tracker</h2>
    <p>Sign in to keep your personal tracker private and synced across devices.</p>
    <button class="google" id="googleBtn">Continue with Google</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="app" style="display:none">
<header class="top">
<div class="brand"><div class="logo">✓</div><div><h1>Daily Tracker</h1><p id="subtitle">Personal productivity dashboard</p></div></div>
<div class="user"><span id="status" class="status">Connecting…</span><img id="avatar" class="avatar" style="display:none"><button id="signout" class="ghost">Sign out</button></div>
</header>

<div class="layout">
<main>
<section class="card hero">
<div class="heroRow"><div><div class="dateTitle" id="todayText"></div><div class="muted" id="dateSmall"></div></div><button class="ghost" onclick="refresh()">↻ Refresh</button></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="stats"><div class="stat"><span class="muted">Tasks</span><b id="taskStat">0</b></div><div class="stat"><span class="muted">Done</span><b id="doneStat">0</b></div><div class="stat"><span class="muted">Progress</span><b id="pctStat">0%</b></div></div>
</section>

<section class="card section">
<h2>Today's To-Do</h2>
<div class="inputrow"><input id="taskInput" placeholder="What needs to be done?"><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><button class="primary" onclick="addTask()">Add task</button></div>
<div id="tasks"></div>
</section>

<section class="card section">
<h2>Habits</h2>
<div class="inputrow"><input id="habitInput" placeholder="Add a habit…"><input id="goalInput" placeholder="Goal (optional)"><button class="primary" onclick="addHabit()">Add</button></div>
<div id="habits"></div>
</section>

<section class="card section">
<h2>Monthly Habit Tracker</h2>
<div class="monthHeader"><b id="monthName"></b><div><button class="ghost" onclick="monthMove(-1)">←</button> <button class="ghost" onclick="monthMove(1)">→</button></div></div>
<div class="monthGrid"><table class="table"><thead id="mhead"></thead><tbody id="mbody"></tbody></table></div>
</section>
</main>

<aside>
<div class="card sideSticky">
<h2>This Month</h2>
<div id="calendar" class="calendar"></div>
<div class="section"><h2>Notes</h2><textarea id="notes" style="width:100%" placeholder="Notes for today…"></textarea><button class="primary" style="margin-top:8px;width:100%" onclick="saveNotes()">Save notes</button></div>
<div class="section"><h2>Report</h2><button class="ghost" style="width:100%" onclick="printReport()">Print / Save monthly PDF</button></div>
</div>
</aside>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyAipiHiXzu4mSvK6BbNjImOHYdkqxKSt3c",
 authDomain:"tracking-98a71.firebaseapp.com",
 databaseURL:"https://tracking-98a71-default-rtdb.firebaseio.com/",
 projectId:"tracking-98a71",
 storageBucket:"tracking-98a71.firebasestorage.app",
 messagingSenderId:"841004547092",
 appId:"1:841004547092:web:129ea46b2297ce01c0fb01",
 measurementId:"G-XQFRPXB3J9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
const DB="https://tracking-98a71-default-rtdb.firebaseio.com";
let user=null,state={tasks:{},habits:{},dailyRecords:{}},viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const $=id=>document.getElementById(id);
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=dateKey(new Date());

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function setStatus(t,ok=true){$("status").textContent=t;$("status").className="status "+(ok?"ok":"bad")}
async function api(path,opt={}){
 if(!user)throw Error("Not signed in");
 const token=await user.getIdToken();
 const sep=path.includes("?")?"&":"?";
 const url=DB+path+".json"+sep+"auth="+encodeURIComponent(token);
 const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
 const tx=await r.text();
 if(!r.ok)throw Error("HTTP "+r.status+" "+tx);
 return tx?JSON.parse(tx):null;
}
function userRoot(){return "/users/"+user.uid}

async function refresh(){
 try{
  state=await api(userRoot())||{};
  state.tasks||={};state.habits||={};state.dailyRecords||={};
  $("notes").value=state.dailyRecords[today]?.notes||"";
  renderAll();setStatus("● Firebase connected",true);
 }catch(e){setStatus("● Firebase error",false);console.error(e)}
}
async function write(path,value){return api(path,{method:"PUT",body:JSON.stringify(value)})}
async function addTask(){let title=$("taskInput").value.trim();if(!title)return;let id="t_"+Date.now();try{await write(userRoot()+"/tasks/"+id,{title,date:today,priority:$("priority").value,completed:false,createdAt:Date.now()});$("taskInput").value="";await refresh()}catch(e){alert("Task not saved: "+e.message)}}
async function toggleTask(id){let t=state.tasks[id];if(!t)return;try{await write(userRoot()+"/tasks/"+id,{...t,completed:!t.completed});await refresh()}catch(e){alert(e.message)}}
async function deleteTask(id){if(!confirm("Delete this task?"))return;try{await api(userRoot()+"/tasks/"+id,{method:"DELETE"});await refresh()}catch(e){alert(e.message)}}
function renderTasks(){let a=Object.entries(state.tasks).filter(([,t])=>t.date===today).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));$("tasks").innerHTML=a.length?a.map(([id,t])=>`<div class="task ${t.completed?"done":""}"><input type="checkbox" ${t.completed?"checked":""} onchange="toggleTask('${id}')"><div class="taskTitle">${esc(t.title)}</div><span class="tag">${esc(t.priority)}</span><button class="danger" onclick="deleteTask('${id}')">×</button></div>`).join(""):'<div class="muted" style="padding:18px 0;text-align:center">Nothing planned yet.</div>'}
async function addHabit(){let name=$("habitInput").value.trim();if(!name)return;let id="h_"+Date.now();try{await write(userRoot()+"/habits/"+id,{name,goal:$("goalInput").value.trim(),active:true,createdAt:Date.now()});$("habitInput").value="";$("goalInput").value="";await refresh()}catch(e){alert("Habit not saved: "+e.message)}}
async function toggleHabit(id,d){let on=!!state.dailyRecords[d]?.habitChecks?.[id];try{if(on)await api(userRoot()+"/dailyRecords/"+d+"/habitChecks/"+id,{method:"DELETE"});else await write(userRoot()+"/dailyRecords/"+d+"/habitChecks/"+id,true);await refresh()}catch(e){alert("Habit check not saved: "+e.message)}}
async function deleteHabit(id){if(!confirm("Delete this habit?"))return;try{await api(userRoot()+"/habits/"+id,{method:"DELETE"});await refresh()}catch(e){alert(e.message)}}
function renderHabits(){let a=Object.entries(state.habits).filter(([,h])=>h.active!==false);$("habits").innerHTML=a.length?a.map(([id,h])=>{let on=!!state.dailyRecords[today]?.habitChecks?.[id];return `<div class="habitRow"><div><b>${esc(h.name)}</b><div class="muted" style="font-size:11px">${esc(h.goal||"Daily")}</div></div><button class="check ${on?"on":""}" onclick="toggleHabit('${id}','${today}')">${on?"✓ Done":"Mark done"}</button><button class="danger" onclick="deleteHabit('${id}')">×</button></div>`}).join(""):'<div class="muted" style="padding:18px 0;text-align:center">Add habits to start tracking.</div>'}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function renderMonth(){let y=viewMonth.getFullYear(),m=viewMonth.getMonth(),n=dim(y,m);$("monthName").textContent=viewMonth.toLocaleString(undefined,{month:"long",year:"numeric"});let h="<tr><th>Habit</th>";for(let i=1;i<=n;i++)h+=`<th>${i}</th>`;$("mhead").innerHTML=h+"</tr>";let a=Object.entries(state.habits).filter(([,x])=>x.active!==false);$("mbody").innerHTML=a.length?a.map(([id,x])=>{let r=`<tr><td><b>${esc(x.name)}</b></td>`;for(let i=1;i<=n;i++){let d=dateKey(new Date(y,m,i)),on=!!state.dailyRecords[d]?.habitChecks?.[id];r+=`<td><button class="cell ${on?"on":""}" onclick="toggleHabit('${id}','${d}')">${on?"✓":""}</button></td>`}return r+"</tr>"}).join(""):`<tr><td colspan="${n+1}" class="muted">No habits yet.</td></tr>`}
function monthMove(v){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+v,1);renderMonth();renderCalendar()}
function renderCalendar(){let y=viewMonth.getFullYear(),m=viewMonth.getMonth(),n=dim(y,m),first=new Date(y,m,1).getDay(),s="";["S","M","T","W","T","F","S"].forEach(x=>s+=`<div class="muted" style="text-align:center;font-size:10px">${x}</div>`);for(let i=0;i<first;i++)s+="<div></div>";for(let i=1;i<=n;i++){let d=dateKey(new Date(y,m,i)),c=Object.keys(state.dailyRecords[d]?.habitChecks||{}).length;s+=`<div class="day ${d===today?"today":""} ${c?"has":""}"><div class="dayNum">${i}</div><div class="dayCount">${c?c+" ✓":""}</div></div>`}$("calendar").innerHTML=s}
function renderAnalytics(){let a=Object.values(state.tasks).filter(t=>t.date===today),d=a.filter(t=>t.completed).length,p=a.length?Math.round(d/a.length*100):0;$("taskStat").textContent=a.length;$("doneStat").textContent=d;$("pctStat").textContent=p+"%";$("bar").style.width=p+"%"}
async function saveNotes(){try{await write(userRoot()+"/dailyRecords/"+today+"/notes",$("notes").value);setStatus("● Notes saved",true);setTimeout(()=>setStatus("● Firebase connected",true),1000)}catch(e){alert("Notes not saved: "+e.message)}}
function renderAll(){renderTasks();renderHabits();renderMonth();renderCalendar();renderAnalytics()}
function printReport(){let y=viewMonth.getFullYear(),m=viewMonth.getMonth(),n=dim(y,m),rows=Object.entries(state.habits).filter(([,h])=>h.active!==false).map(([id,h])=>{let c=0;for(let i=1;i<=n;i++){let d=dateKey(new Date(y,m,i));if(state.dailyRecords[d]?.habitChecks?.[id])c++}return `<tr><td>${esc(h.name)}</td><td>${c}/${n}</td><td>${Math.round(c/n*100)}%</td></tr>`}).join("");let w=open("","_blank");w.document.write(`<html><head><title>Daily Tracker Report</title><style>body{font-family:Arial;padding:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>Daily Tracker — ${viewMonth.toLocaleString(undefined,{month:"long",year:"numeric"})}</h1><table><tr><th>Habit</th><th>Completed</th><th>Rate</th></tr>${rows}</table><p>Print dialog: choose “Save as PDF”.</p></body></html>`);w.document.close();w.print()}

$("todayText").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
$("dateSmall").textContent=today;

$("googleBtn").onclick=async()=>{
 try{$("loginError").style.display="none";await signInWithPopup(auth,provider)}
 catch(e){$("loginError").textContent=e.code+": "+e.message;$("loginError").style.display="block";console.error(e)}
};
$("signout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 user=u;
 if(u){
  $("login").classList.add("hidden");$("app").style.display="block";
  $("subtitle").textContent=u.displayName||u.email||"Personal productivity dashboard";
  if(u.photoURL){$("avatar").src=u.photoURL;$("avatar").style.display="block"}
  await refresh();
 }else{
  $("login").classList.remove("hidden");$("app").style.display="none";
 }
});
</script>
</body>
</html>
